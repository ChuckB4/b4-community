title: "[Indicator] "
labels: ["indicator"]
body:
  - type: markdown
    attributes:
      value: |
        Share an indicator you built. Tip: in B4 Studio set Visibility → Public, then **Share → Copy community post** and paste it below.
        Community builds are not B4 releases and are not reviewed for profitability or live-trading safety.
  - type: textarea
    id: post
    attributes:
      label: Your build
      description: What it does, its settings, the source code (in a ```csharp block) and, if you have one, a B4 Studio share link.
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: License
      options:
        - MIT
        - Apache-2.0
        - MPL-2.0
    validations:
      required: true
  - type: checkboxes
    id: tested
    attributes:
      label: What have you tested?
      options:
        - label: It compiles in NinjaTrader 8 (F5) with no errors
        - label: Checked on a historical chart
        - label: Checked in Playback or real time (bar close vs. real time)
  - type: checkboxes
    id: agree
    attributes:
      label: Community rules
      options:
        - label: I wrote this code or have the right to share it under the license above, and it contains no proprietary B4 code.
          required: true
        - label: I make no profit claims, and I understand this is not trading advice.
          required: true
